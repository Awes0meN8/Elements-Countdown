<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown</title>
  <style>
    @font-face {
      font-family: 'MyFont';
      src: url('Elements.ttf') format('truetype');
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'MyFont', sans-serif;
      font-size: 40vw;
      color: #ffc202;
    }
  </style>
</head>
<body>
  <span id="num">60</span>
  <script>
    let n = 60;
    const el = document.getElementById('num');
    const t = setInterval(() => {
      el.textContent = --n;
      if (n === 0) clearInterval(t);
    }, 1000);
  </script>
</body>
</html>
